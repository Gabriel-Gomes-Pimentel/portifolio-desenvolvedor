<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Ilustração do projeto Safira: estimativa de risco de detração por passageiro antes da resposta à pesquisa de NPS">
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="sf-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="sf-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sf-bg)"/>

  <!-- janela -->
  <rect x="48" y="56" width="704" height="488" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
  <path d="M48 74a18 18 0 0 1 18-18h668a18 18 0 0 1 18 18v34H48z" fill="#fafafc"/>
  <line x1="48" y1="108" x2="752" y2="108" stroke="#f0f0f0"/>
  <circle cx="78" cy="82" r="5" fill="#e0e0e0"/>
  <circle cx="96" cy="82" r="5" fill="#e0e0e0"/>
  <circle cx="114" cy="82" r="5" fill="#e0e0e0"/>
  <rect x="150" y="74" width="130" height="16" rx="8" fill="#f0f0f0"/>

  <!-- linha do tempo: voo, janela de acao, resposta -->
  <g>
    <line x1="96" y1="160" x2="704" y2="160" stroke="#e8e8ea" stroke-width="2"/>
    <rect x="200" y="146" width="300" height="28" rx="14" fill="url(#sf-accent)" opacity="0.12"/>
    <circle cx="200" cy="160" r="7" fill="url(#sf-accent)"/>
    <circle cx="500" cy="160" r="7" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
    <rect x="182" y="186" width="36" height="7" rx="3.5" fill="#c8c8cc"/>
    <rect x="470" y="186" width="60" height="7" rx="3.5" fill="#c8c8cc"/>
  </g>

  <!-- curva de risco estimado -->
  <g>
    <line x1="96" y1="440" x2="704" y2="440" stroke="#f0f0f0" stroke-width="2"/>
    <line x1="96" y1="380" x2="704" y2="380" stroke="#f5f5f7"/>
    <line x1="96" y1="320" x2="704" y2="320" stroke="#f5f5f7"/>
    <line x1="96" y1="260" x2="704" y2="260" stroke="#f5f5f7"/>

    <path d="M96 400 C 180 372, 236 396, 300 348 S 420 300, 480 316 S 604 246, 704 232 L704 440 L96 440 Z" fill="url(#sf-area)"/>
    <path d="M96 400 C 180 372, 236 396, 300 348 S 420 300, 480 316 S 604 246, 704 232"
          fill="none" stroke="url(#sf-accent)" stroke-width="3" stroke-linecap="round"/>

    <!-- passageiros pontuados: os de risco alto ficam em destaque -->
    <circle cx="180" cy="392" r="5" fill="#d5d5da"/>
    <circle cx="264" cy="366" r="5" fill="#d5d5da"/>
    <circle cx="348" cy="330" r="5" fill="#d5d5da"/>
    <circle cx="432" cy="308" r="6" fill="url(#sf-accent)"/>
    <circle cx="516" cy="300" r="5" fill="#d5d5da"/>
    <circle cx="600" cy="262" r="6" fill="url(#sf-accent)"/>
    <circle cx="672" cy="238" r="7" fill="url(#sf-accent)"/>
    <circle cx="672" cy="238" r="14" fill="none" stroke="#0066cc" stroke-opacity="0.28" stroke-width="2"/>
  </g>

  <!-- legenda -->
  <g>
    <circle cx="112" cy="492" r="5" fill="url(#sf-accent)"/>
    <rect x="128" y="487" width="96" height="9" rx="4.5" fill="#e0e0e0"/>
    <circle cx="268" cy="492" r="5" fill="#d5d5da"/>
    <rect x="284" y="487" width="76" height="9" rx="4.5" fill="#f0f0f0"/>
    <rect x="560" y="478" width="128" height="28" rx="14" fill="url(#sf-accent)" opacity="0.14"/>
    <rect x="580" y="488" width="88" height="9" rx="4.5" fill="#0066cc" opacity="0.45"/>
  </g>
</svg>
